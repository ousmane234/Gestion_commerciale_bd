{% extends "base.html" %}
{% block content %}
<h2>Modifier le produit</h2>
<form method="post" class="row g-2">
  <div class="col-md-4"><input name="designation" class="form-control" value="{{ p.designation }}" required></div>
  <div class="col-md-3"><input name="prix_vente" type="number" step="0.01" min="0" class="form-control" value="{{ p.prix_vente }}" required></div>
  <div class="col-md-3"><select name="id_categorie" class="form-select">
    {% for c in categories %}<option value="{{ c.id_categorie }}" {{ 'selected' if c.id_categorie == p.id_categorie }}>{{ c.libelle }}</option>{% endfor %}
  </select></div>
  <div class="col-md-2"><button class="btn btn-success">Enregistrer</button>
    <a class="btn btn-secondary" href="{{ url_for('produits') }}">Annuler</a></div>
</form>
{% endblock %}
