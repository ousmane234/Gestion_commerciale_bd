{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h2 class="mb-0">Ventes</h2>
  <a class="btn btn-success" href="{{ url_for('vente_nouvelle') }}">+ Nouvelle vente</a></div>
<div class="table-responsive"><table class="table table-striped bg-white">
  <thead><tr><th>#</th><th>Date</th><th>Lignes</th><th class="text-end">Total</th><th></th></tr></thead>
  <tbody>
  {% for v in ventes %}<tr><td>{{ v.id_vente }}</td><td>{{ v.date_vente }}</td><td>{{ v.nb_lignes }}</td>
    <td class="text-end">{{ '{:,.0f}'.format(v.total).replace(',', ' ') }} FCFA</td>
    <td class="text-end"><a class="btn btn-sm btn-outline-primary" href="{{ url_for('vente_detail', id=v.id_vente) }}">Détail</a></td></tr>
  {% else %}<tr><td colspan="5" class="text-center text-muted">Aucune vente</td></tr>{% endfor %}
  </tbody></table></div>
{% endblock %}
