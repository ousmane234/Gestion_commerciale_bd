{% extends "base.html" %}
{% block content %}
<h2>Nouvel approvisionnement</h2>
<form method="post">
  <div class="row g-2 mb-3">
    <div class="col-md-4"><label class="form-label">Date</label><input type="date" name="date_appro" value="{{ today }}" class="form-control" required></div>
    <div class="col-md-8"><label class="form-label">Fournisseur</label><select name="id_fournisseur" class="form-select" required>
      {% for f in fournisseurs %}<option value="{{ f.id_fournisseur }}">{{ f.nom }}</option>{% endfor %}
    </select>
    {% if not fournisseurs %}<div class="form-text text-danger">Créez d'abord un <a href="{{ url_for('fournisseurs') }}">fournisseur</a>.</div>{% endif %}</div>
  </div>
  <h5>Produits achetés</h5>
<template id="ligne-tpl">
  <div class="row g-2 mb-2 ligne">
    <div class="col-md-5"><select name="id_produit" class="form-select produit" required>
      <option value="">— Produit —</option>
      {% for p in produits %}<option value="{{ p.id_produit }}" data-prix="{{ p.prix_vente }}">{{ p.designation }}</option>{% endfor %}
    </select></div>
    <div class="col-5 col-md-2"><input name="quantite" type="number" min="1" class="form-control" placeholder="Quantité" required></div>
    <div class="col-5 col-md-3"><input name="prix" type="number" step="0.01" min="0" class="form-control prix" placeholder="Prix d'achat unitaire" required></div>
    <div class="col-2 col-md-2"><button type="button" class="btn btn-outline-danger w-100 sup">×</button></div>
  </div>
</template>
<div id="lignes"></div>
<button type="button" id="add" class="btn btn-outline-secondary mb-3">+ Ajouter une ligne</button>
<script>
const tpl = document.getElementById('ligne-tpl'), box = document.getElementById('lignes');
function addLigne() {
  const n = tpl.content.cloneNode(true);
  n.querySelector('.sup').onclick = e => { if (box.children.length > 1) e.target.closest('.ligne').remove(); };
  
  box.appendChild(n);
}
document.getElementById('add').onclick = addLigne;
addLigne();
</script>
  <div><button class="btn btn-success">Enregistrer</button>
  <a class="btn btn-secondary" href="{{ url_for('approvisionnements') }}">Annuler</a></div>
</form>
{% endblock %}
