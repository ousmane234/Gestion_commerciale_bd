<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestion commerciale</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('dashboard') }}">Gestion commerciale</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="menu">
      <div class="navbar-nav">
        <a class="nav-link" href="{{ url_for('dashboard') }}">Tableau de bord</a>
        <a class="nav-link" href="{{ url_for('produits') }}">Produits</a>
        <a class="nav-link" href="{{ url_for('categories') }}">Catégories</a>
        <a class="nav-link" href="{{ url_for('fournisseurs') }}">Fournisseurs</a>
        <a class="nav-link" href="{{ url_for('approvisionnements') }}">Approvisionnements</a>
        <a class="nav-link" href="{{ url_for('ventes') }}">Ventes</a>
        <a class="nav-link" href="{{ url_for('depenses') }}">Dépenses</a>
        <a class="nav-link" href="{{ url_for('stock') }}">Stock</a>
      </div>
    </div>
  </div>
</nav>
<div class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show">{{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
